<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="financeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00695c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004d40;stop-opacity:1" />
    </linearGradient>
    <pattern id="financeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#financeGradient)"/>
  <rect width="1200" height="630" fill="url(#financeGrid)"/>
  
  <!-- Finance/Chart Icon -->
  <g transform="translate(60, 80)">
    <rect x="0" y="100" width="40" height="150" fill="rgba(255,255,255,0.3)"/>
    <rect x="50" y="50" width="40" height="200" fill="rgba(255,255,255,0.5)"/>
    <rect x="100" y="80" width="40" height="170" fill="rgba(255,255,255,0.4)"/>
    <rect x="150" y="20" width="40" height="230" fill="rgba(255,255,255,0.7)"/>
    <line x1="0" y1="250" x2="200" y2="250" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  </g>
  
  <!-- Payment Reconciliation Flow -->
  <g transform="translate(50, 380)">
