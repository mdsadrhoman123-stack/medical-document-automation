<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="executiveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <pattern id="executiveGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#executiveGradient)"/>
  <rect width="1200" height="630" fill="url(#executiveGrid)"/>
  
  <!-- Dashboard/Report Icon -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="280" height="200" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    
    <!-- Mini charts -->
    <rect x="20" y="20" width="100" height="60" fill="rgba(255,255,255,0.2)"/>
    <line x1="20" y1="50" x2="120" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <line x1="20" y1="35" x2="120" y2="35" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <rect x="140" y="20" width="100" height="60" fill="rgba(255,255,255,0.2)"/>
    <circle cx="190" cy="50" r="20" fill="rgba(255,255,255,0.4)"/>
    
    <rect x="20" y="100" width="220" height="80" fill="rgba(255,255,255,0.15)"/>
    <line x1="20" y1="120" x2="240" y2="120" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="20" y1="140" x2="240" y2="140" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="20" y1="160" x2="240" y2="160" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  </g>
  
  <!-- Report Automation Flow -->
  <g transform="translate(50, 350)">
    <circle cx="50" cy="50" r="30" fill="#1976d2" opacity="0.8"/>
    <text x="50" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">DATA</text>
    
    <line x1="80" y1="50" x2="150" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    
    <circle cx="180" cy="50" r="30" fill="#0288d1" opacity="0.8"/>
    <text x="180" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">ANA</text>
    
    <line x1="210" y1="50" x2="280" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    
    <circle cx="310" cy="50" r="30" fill="#01579b" opacity="0.8"/>
    <text x="310" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">RPT</text>
  </g>
  
  <!-- Text Content -->
  <text x="500" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">
    Executive Report Automation
  </text>
  <text x="500" y="230" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.9)">
    Intelligent Impact Dashboard System
  </text>
  <text x="500" y="280" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.7)">
    Automate executive reporting and impact visualization
  </text>
  
  <!-- Tech Stack -->
  <g transform="translate(500, 350)">
    <rect x="0" y="0" width="100" height="40" rx="5" fill="rgba(255,87,34,0.8)"/>
    <text x="50" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="bold">n8n</text>
    
    <rect x="120" y="0" width="100" height="40" rx="5" fill="rgba(33,150,243,0.8)"/>
    <text x="170" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="bold">PostgreSQL</text>
    
    <rect x="240" y="0" width="100" height="40" rx="5" fill="rgba(76,175,80,0.8)"/>
    <text x="290" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Tableau</text>
  </g>
  
  <!-- Results -->
  <g transform="translate(500, 420)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">
      <tspan x="0" dy="0">âœ“ Real-time Impact Tracking</tspan>
      <tspan x="0" dy="25">âœ“ 75% Reporting Time Saved</tspan>
      <tspan x="0" dy="25">âœ“ Executive Decision Support</tspan>
    </text>
  </g>
  
  <!-- Branding -->
  <text x="1150" y="610" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">
    Built by K MD SAYAD RAHMAN | Sayad.dev
  </text>
</svg>