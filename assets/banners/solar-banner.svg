    <line x1="66" y1="0" x2="66" y2="140" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="133" y1="0" x2="133" y2="140" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
