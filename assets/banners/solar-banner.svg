    <line x1="250" y1="10" x2="250" y2="30" stroke="rgba(241,196,15,0.6)" stroke-width="3"/>
    <line x1="250" y1="110" x2="250" y2="130" stroke="rgba(241,196,15,0.6)" stroke-width="3"/>
    <line x1="190" y1="70" x2="210" y2="70" stroke="rgba(241,196,15,0.6)" stroke-width="3"/>
    <line x1="290" y1="70" x2="310" y2="70" stroke="rgba(241,196,15,0.6)" stroke-width="3"/>
  </g>
  
